[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sanskrit-ocr-prototype"
version = "0.1.0"
description = "Reproducible isolated Devanagari character recognition"
requires-python = ">=3.12,<3.15"
dependencies = ["torch>=2.6,<3", "torchvision>=0.21,<1", "Pillow>=11,<13", "numpy>=2,<3", "scipy>=1.13,<2", "scikit-learn>=1.6,<2", "matplotlib>=3.9,<4", "streamlit>=1.65,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
sanskrit-ocr = "sanskrit_ocr.cli:main"

[tool.setuptools.packages.find]
include = ["sanskrit_ocr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
